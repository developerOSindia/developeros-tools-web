[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "developeros-tools-web"
version = "1.0.0"
description = "DeveloperOS Central Tools Directory Web Portal"
readme = "README.md"
authors = [{ name = "DeveloperOS Team", email = "engineering@developeros.in" }]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
